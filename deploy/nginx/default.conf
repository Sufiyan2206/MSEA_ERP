# Serves the PWA and proxies /api to the Flask container. HTTPS is terminated by the OCI Load Balancer.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on; gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /health { proxy_pass http://api:8000/health; }

    # service worker and manifest must never be cached aggressively
    location ~* (sw\.js|manifest\.webmanifest|workbox-.*\.js)$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
